[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "hyperbolica"
version = "0.1.0"
description = "Pure-Symbolica exact hyperlogarithm integration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "DISTRIBUTION-LICENSE.md" }
license-files = ["DISTRIBUTION-LICENSE.md", "LICENSE", "vendor/symbolica/License.md"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

[tool.maturin]
bindings = "pyo3"
features = ["python-extension"]
module-name = "hyperbolica"
strip = true
