[package]
name = "hyperbolica"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license-file = "DISTRIBUTION-LICENSE.md"
description = "A Rust port of HyperFLINT backed by Symbolica"
publish = false

[lib]
name = "hyperbolica"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["native", "faster-alloc"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr"]
faster-alloc = ["symbolica/faster_alloc"]
wasm = ["symbolica/wasm"]
python = ["dep:pyo3", "symbolica/python_export"]
python_stubgen = ["python", "dep:pyo3-stub-gen", "symbolica/python_stubgen"]

[[bin]]
name = "hyperflint"
path = "src/bin/hyperflint.rs"

[dependencies]
rayon = "1.11"
pyo3 = { version = "0.28", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
symbolica = { version = "3.0.1", default-features = false }
pyo3-stub-gen = { version = "0.17", optional = true, default-features = false }
thiserror = "2.0"

[patch.crates-io]
symbolica = { path = "vendor/symbolica" }
numerica = { path = "vendor/symbolica/lib/numerica" }
graphica = { path = "vendor/symbolica/lib/graphica" }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "core_algebra"
harness = false

[[bench]]
name = "euler"
harness = false

[[bench]]
name = "lr_structural_keys"
harness = false

[[bench]]
name = "semantic_keys"
harness = false

[profile.release]
codegen-units = 1
lto = true

[profile.bench]
codegen-units = 1
lto = true
